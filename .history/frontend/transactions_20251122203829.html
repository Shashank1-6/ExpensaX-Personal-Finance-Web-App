<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack Pro - Transactions</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex">

  <!-- Sidebar -->
  <aside class="w-64 h-screen bg-white shadow-lg fixed left-0 top-0 p-6">
    <h2 class="text-2xl font-bold text-indigo-600 mb-8">FinTrack Pro</h2>

    <nav class="space-y-4">
      <a href="index.html" class="block font-medium text-gray-700 hover:text-indigo-600">Dashboard</a>
      <a href="transactions.html" class="block font-medium text-indigo-600">Transactions</a>
      <a href="insights.html" class="block font-medium text-gray-700 hover:text-indigo-600">Insights</a>
      <a href="#" class="block font-medium text-gray-700 hover:text-indigo-600">Settings</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 w-full p-8">

    <!-- Header -->
    <div class="flex justify-between items-center mb-10">
      <h1 class="text-3xl font-bold">Transactions</h1>

      <button class="px-4 py-2 rounded-md bg-indigo-600 text-white hover:bg-indigo-700" id="addBtn">
        + Add Transaction
      </button>
    </div>

    <!-- Filters -->
    <div class="flex gap-3 mb-6 flex-wrap">
      <button class="filter-btn px-4 py-2 rounded-md bg-gray-200" data-filter="all">All</button>
      <button class="filter-btn px-4 py-2 rounded-md bg-gray-200" data-filter="income">Income</button>
      <button class="filter-btn px-4 py-2 rounded-md bg-gray-200" data-filter="expense">Expense</button>
      <button class="filter-btn px-4 py-2 rounded-md bg-gray-200" data-filter="Food">Food</button>
      <button class="filter-btn px-4 py-2 rounded-md bg-gray-200" data-filter="Rent">Rent</button>
      <button class="filter-btn px-4 py-2 rounded-md bg-gray-200" data-filter="Shopping">Shopping</button>
      <button class="filter-btn px-4 py-2 rounded-md bg-gray-200" data-filter="Medicine">Medicine</button>
      <button class="filter-btn px-4 py-2 rounded-md bg-gray-200" data-filter="Utilities">Utilities</button>
      <button class="filter-btn px-4 py-2 rounded-md bg-gray-200" data-filter="Subscription">Subscription</button>
    </div>

    <!-- Desktop Table View -->
    <div class="hidden md:block overflow-auto">
      <table class="w-full bg-white shadow rounded-xl">
        <thead>
          <tr class="bg-gray-200 text-left">
            <th class="p-4">Title</th>
            <th class="p-4">Category</th>
            <th class="p-4">Type</th>
            <th class="p-4">Amount</th>
            <th class="p-4">Date</th>
            <th class="p-4">Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- Mobile Card View -->
    <div id="cardList" class="md:hidden flex flex-col gap-4 mt-6"></div>

  </main>

  <!-- Add Transaction Slide Panel -->
  <div id="addPanel" class="fixed top-0 right-0 h-full w-96 bg-white shadow-xl p-6 transform translate-x-full transition-transform duration-300 overflow-y-auto">

    <h2 class="text-2xl font-bold mb-6">Add Transaction</h2>

    <label class="block font-medium">Amount</label>
    <input id="amountInput" type="number" placeholder="Enter amount"
      class="w-full p-3 border rounded-lg mb-4">

    <label class="block font-medium">Title</label>
    <input id="titleInput" type="text" placeholder="e.g. Rent, Swiggy Order"
      class="w-full p-3 border rounded-lg mb-4">

    <div class="flex items-center gap-3 mb-4">
      <label class="font-medium">Type:</label>
      <select id="typeSelect" class="p-2 border rounded-lg">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
    </div>

    <label class="font-medium mb-2 block">Category</label>
    <div id="categoryGrid" class="grid grid-cols-3 gap-3 mb-6">
      <button class="cat-btn p-3 bg-gray-200 rounded-lg" data-cat="Food">🍔 Food</button>
      <button class="cat-btn p-3 bg-gray-200 rounded-lg" data-cat="Rent">🏠 Rent</button>
      <button class="cat-btn p-3 bg-gray-200 rounded-lg" data-cat="Shopping">🛍 Shopping</button>
      <button class="cat-btn p-3 bg-gray-200 rounded-lg" data-cat="Medicine">💊 Medicine</button>
      <button class="cat-btn p-3 bg-gray-200 rounded-lg" data-cat="Utilities">🔌 Utilities</button>
      <button class="cat-btn p-3 bg-gray-200 rounded-lg" data-cat="Subscription">📦 Subscription</button>
      <button class="cat-btn p-3 bg-gray-200 rounded-lg" data-cat="Salary">💼 Salary</button>
    </div>

    <div class="flex items-center gap-3 mb-6">
      <input type="checkbox" id="recurringCheck">
      <label>Recurring Monthly</label>
    </div>

    <button id="saveTransaction"
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3 rounded-lg">
      Save Transaction
    </button>

    <button id="closePanel" class="mt-4 w-full p-2 text-center font-medium bg-gray-200 rounded-lg">
      Cancel
    </button>
  </div>

  <!-- Scripts MUST be at bottom -->
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/transactions.js"></script>

</body>
</html>
