<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack Pro - Dashboard</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex">

  <!-- Sidebar -->
  <aside class="w-64 h-screen bg-white shadow-lg fixed left-0 top-0 p-6">
    <h2 class="text-2xl font-bold text-indigo-600 mb-8">FinTrack Pro</h2>

    <nav class="space-y-4">
      <a href="index.html" class="block font-medium text-indigo-600">Dashboard</a>
      <a href="transactions.html" class="block font-medium text-gray-700 hover:text-indigo-600">Transactions</a>
      <a href="insights.html" class="block font-medium text-gray-700 hover:text-indigo-600">Insights</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 w-full p-8">

    <!-- Header -->
    <div class="flex justify-between items-center mb-10">
      <h1 class="text-3xl font-bold">Dashboard</h1>
      <button class="px-4 py-2 rounded-md bg-indigo-600 text-white hover:bg-indigo-700">
        Toggle Theme
      </button>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-3 gap-6 mb-10">
      <div class="p-6 bg-white shadow rounded-xl">
        <h3 class="text-lg font-medium text-gray-600">Total Balance</h3>
        <p id="balance" class="text-3xl font-bold text-gray-900 mt-3">₹ 0</p>
      </div>

      <div class="p-6 bg-white shadow rounded-xl">
        <h3 class="text-lg font-medium text-gray-600">Income</h3>
        <p id="income" class="text-3xl font-bold text-green-600 mt-3">₹ 0</p>
      </div>

      <div class="p-6 bg-white shadow rounded-xl">
        <h3 class="text-lg font-medium text-gray-600">Expenses</h3>
        <p id="expense" class="text-3xl font-bold text-red-600 mt-3">₹ 0</p>
      </div>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-2 gap-6">
      <div class="bg-white p-6 shadow rounded-xl">
        <h3 class="font-bold mb-4">Monthly Overview</h3>
        <div id="barChart"></div>
      </div>

      <div class="bg-white p-6 shadow rounded-xl">
        <h3 class="font-bold mb-4">Category Breakdown</h3>
        <div id="pieChart"></div>
      </div>
    </div>
  </main>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
