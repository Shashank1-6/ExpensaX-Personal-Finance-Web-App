<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack Pro - Insights</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 flex">

  <!-- Sidebar -->
  <aside class="w-64 h-screen bg-white shadow-lg fixed left-0 top-0 p-6">
    <h2 class="text-2xl font-bold text-indigo-600 mb-8">FinTrack Pro</h2>

    <nav class="space-y-4">
      <a href="index.html" class="block font-medium text-gray-700 hover:text-indigo-600">Dashboard</a>
      <a href="transactions.html" class="block font-medium text-gray-700 hover:text-indigo-600">Transactions</a>
      <a href="insights.html" class="block font-medium text-indigo-600">Insights</a>
      <a href="#" class="block font-medium text-gray-700 hover:text-indigo-600">Settings</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 w-full p-8">

    <h1 class="text-3xl font-bold mb-8">Insights & Analytics</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Income vs Expense Donut -->
      <div class="bg-white shadow rounded-xl p-4">
        <h2 class="text-xl mb-2 font-semibold text-center">Income vs Expense</h2>
        <canvas id="donutChart" height="300"></canvas>
      </div>

      <!-- Category bar chart -->
      <div class="bg-white shadow rounded-xl p-4">
        <h2 class="text-xl mb-2 font-semibold text-center">Spending by Category</h2>
        <canvas id="categoryChart" height="300"></canvas>
      </div>

      <!-- Trend line chart -->
      <div class="bg-white shadow rounded-xl p-4 md:col-span-2">
        <h2 class="text-xl mb-2 font-semibold text-center">Monthly Trend</h2>
        <canvas id="trendChart" height="300"></canvas>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/insights.js"></script>

</body>
</html>
