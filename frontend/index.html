<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpensaX - Dashboard</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex">

  <!-- Sidebar -->
  <aside class="w-64 h-screen bg-white shadow-lg fixed left-0 top-0 p-6">
    <h2 class="text-2xl font-bold text-indigo-600 mb-8">ExpensaX</h2>

    <nav class="space-y-4">
      <a href="index.html" class="block font-medium text-indigo-600">Dashboard</a>
      <a href="transactions.html" class="block font-medium text-gray-700 hover:text-indigo-600">Transactions</a>
      <a href="insights.html" class="block font-medium text-gray-700 hover:text-indigo-600">Insights</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 w-full p-8">

    <!-- Header -->
    <div class="mb-10">
      <h1 class="text-3xl font-bold">Dashboard</h1>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div class="p-6 bg-white rounded-xl shadow text-center">
        <h3 class="text-xl font-semibold text-gray-600">Income</h3>
        <p id="incomeValue" class="text-3xl font-bold text-green-600 mt-2">₹0</p>
      </div>

      <div class="p-6 bg-white rounded-xl shadow text-center">
        <h3 class="text-xl font-semibold text-gray-600">Expense</h3>
        <p id="expenseValue" class="text-3xl font-bold text-red-600 mt-2">₹0</p>
      </div>

      <div class="p-6 bg-white rounded-xl shadow text-center">
        <h3 class="text-xl font-semibold text-gray-600">Balance</h3>
        <p id="balanceValue" class="text-3xl font-bold text-indigo-600 mt-2">₹0</p>
      </div>
    </div>

    <!-- Recent Transactions -->
    <h2 class="text-xl font-bold mb-4">Recent Transactions</h2>
    <ul id="recentList" class="space-y-4"></ul>

  </main>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
